[package]
name = "seda-agent"
version = "0.1.0"
edition = "2021"
description = "Privacy-first local agent for selective event-driven desktop automation"
license = "MIT"

[dependencies]
# Windows UI Automation
uiautomation = "0.24"

# Async runtime
tokio = { version = "1", features = ["full", "sync"] }

# HTTP server for MCP
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
once_cell = "1"
regex = "1"

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "seda-agent"
path = "src/main.rs"
